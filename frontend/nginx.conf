server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' ws: wss:; media-src 'self' blob:; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
    location /health { proxy_pass http://backend:8000; }
    location /ready { proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
}

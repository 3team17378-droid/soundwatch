name: SOUNDWATCH quality
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install -r backend/requirements.txt
      - run: python scripts/init_env.py
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest --cov=app --cov-report=xml --cov-fail-under=80
        working-directory: backend
      - run: ruff check backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test && pnpm typecheck && pnpm build
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 300
      - run: curl --fail http://localhost:8000/ready && curl --fail http://localhost:8080/
      - if: always()
        run: docker compose down -v
